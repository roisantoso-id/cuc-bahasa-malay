# 背单词后台:https://admin.bahasa.cn → 本机 127.0.0.1:4200(admin/server.mjs)
# 服务器上的位置:/etc/nginx/conf.d/jombelajar-admin.conf
# 第一次:先只启用下面的 80 段申请证书(见 admin/README.md),拿到证书后再放上整份

server {
    listen 80;
    listen [::]:80;
    server_name admin.bahasa.cn;
    location /.well-known/acme-challenge/ { root /var/www/jombelajar-admin-acme; }
    location / { return 301 https://admin.bahasa.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.bahasa.cn;

    ssl_certificate     /etc/letsencrypt/live/admin.bahasa.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.bahasa.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;   # 上传照片(base64)
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;  # 批量生成发音比较慢
    }
}
