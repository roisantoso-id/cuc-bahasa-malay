# 宣传官网(静态):https://www.bahasa.cn
# 服务器上的位置:/etc/nginx/conf.d/jombelajar-website.conf
# 证书:Let's Encrypt(certbot webroot 方式),自动续期后重载 nginx

# HTTP:证书验证放行,其余跳转到 https://www.bahasa.cn
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.bahasa.cn 43.157.197.80;

    location /.well-known/acme-challenge/ {
        root /var/www/jombelajar-website;
    }
    location / {
        return 301 https://www.bahasa.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bahasa.cn;

    ssl_certificate     /etc/letsencrypt/live/www.bahasa.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.bahasa.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 注意:location 里写了 add_header 就不会继承这里的,所以 HSTS 在每个 location 里各写一次
    root /var/www/jombelajar-website;
    index index.html;

    # css/js 带内容版本号(?v=hash),可以长缓存;html 不缓存
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    error_page 404 /404.html;
}
