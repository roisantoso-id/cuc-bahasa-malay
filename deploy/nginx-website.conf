# 宣传官网(静态)。暂时没有域名,用服务器 IP 访问;有域名后把 server_name 换成域名并申请证书。
# 服务器上的位置:/etc/nginx/conf.d/jombelajar-website.conf
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 43.157.197.80;

    root /var/www/jombelajar-website;
    index index.html;

    # css/js 带内容版本号(?v=hash),可以长缓存;html 不缓存
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    error_page 404 /404.html;
}
