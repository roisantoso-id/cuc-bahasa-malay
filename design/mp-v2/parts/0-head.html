<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>马来语高频词 · 小程序改版三个方向</title>
<style>
/* ============ 页面外壳（不是小程序的一部分） ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --latin:Georgia,"Times New Roman","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html{background:#e9e4da}
body{font-family:var(--sans);color:#1c2420;line-height:1.6;font-size:15px;overflow-x:hidden}
.doc{max-width:2460px;margin:0 auto;padding:40px 32px 80px}
.doc-head h1{font-family:var(--serif);font-size:34px;line-height:1.25;font-weight:700}
.doc-head p{max-width:760px;color:#47524c;margin-top:10px}
.jump{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.jump a{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:22px;background:#fff;color:#1c2420;text-decoration:none;font-weight:600;border:1px solid #d6cdb9}
.dir{margin-top:56px;padding-top:36px;border-top:2px solid #1c2420}
.dir-intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
.dir-intro h2{font-family:var(--serif);font-size:30px;line-height:1.2}
.dir-intro h2 small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:#727a74;font-weight:400;margin-bottom:6px}
.dir-intro h3{font-size:13px;color:#727a74;font-weight:600;margin-bottom:6px}
.dir-intro p,.dir-intro li{color:#39423d;font-size:15px}
.dir-intro ul{padding-left:18px}
.dir-intro li{margin-bottom:4px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.sw span{display:flex;flex-direction:column;justify-content:flex-end;width:74px;height:58px;border-radius:10px;padding:5px 7px;font:11px/1.25 var(--mono);border:1px solid rgba(0,0,0,.12)}
.phones{display:flex;flex-wrap:wrap;gap:36px 30px;margin-top:34px}
.pw{width:375px}
.pw figcaption{font-size:14px;color:#47524c;margin-top:12px;line-height:1.5}
.pw figcaption b{color:#1c2420}
.verdict{margin-top:64px;padding-top:36px;border-top:2px solid #1c2420}
.verdict h2{font-family:var(--serif);font-size:28px;margin-bottom:14px}
.verdict table{width:100%;border-collapse:collapse;font-size:14px;background:#fffdf8;border-radius:12px;overflow:hidden}
.verdict th,.verdict td{text-align:left;padding:11px 14px;border-bottom:1px solid #e4dccb;vertical-align:top}
.verdict th{background:#1c2420;color:#f7f2e8;font-weight:600}
.verdict td:first-child{font-weight:700;white-space:nowrap}
.verdict p{max-width:860px;margin:12px 0}
.tag{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;font-weight:700}
.tag.e{background:#e3ece4;color:#1f5a43}.tag.m{background:#f5e2c7;color:#8a4a0c}.tag.h{background:#f6d9d2;color:#9b3a26}
@media(max-width:1000px){.dir-intro{grid-template-columns:1fr}.doc{padding:24px 16px 60px}.verdict table{display:block}.verdict tr{display:block;border-bottom:1px solid #e4dccb;padding:8px 0}.verdict th{display:none}.verdict td{display:block;border:0;padding:3px 12px;white-space:normal!important}}
@media(max-width:440px){.phones{zoom:.82}}
@media(max-width:360px){.phones{zoom:.72}}

/* ============ 手机壳和小程序公共骨架 ============ */
.phone{position:relative;width:375px;height:812px;border-radius:46px;overflow:hidden;box-shadow:0 0 0 9px #15181a,0 0 0 10.5px #3a3f42,0 34px 60px -24px rgba(20,24,26,.55);font-family:var(--sans);font-size:15px;line-height:1.5}
.phone *{box-sizing:border-box}
.sb{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:12px 30px 0;font-weight:600;font-size:15px;z-index:5}
.sb i{display:flex;gap:5px;align-items:center}
.sb i b{display:block;width:17px;height:11px;border-radius:3px;border:1.5px solid currentColor;position:relative;opacity:.9}
.sb i b::after{content:"";position:absolute;inset:1.5px;right:4px;background:currentColor;border-radius:1px}
.sb i u{display:block;width:15px;height:10px;background:linear-gradient(90deg,currentColor 0 2.5px,transparent 2.5px 4px,currentColor 4px 6.5px,transparent 6.5px 8px,currentColor 8px 10.5px,transparent 10.5px 12px,currentColor 12px);-webkit-mask:linear-gradient(to top right,#000 50%,transparent 50%);mask:linear-gradient(to top right,#000 50%,transparent 50%)}
.cap{position:absolute;right:7px;top:48px;width:87px;height:32px;border-radius:16px;border:.5px solid rgba(0,0,0,.14);background:rgba(255,255,255,.72);z-index:6;display:flex;align-items:center;justify-content:space-evenly}
.cap::before{content:"";width:18px;height:4px;background:radial-gradient(circle,#111 1.9px,transparent 2.2px) 0 0/6.2px 4px}
.cap::after{content:"";width:15px;height:15px;border-radius:50%;border:2.4px solid #111;box-shadow:inset 0 0 0 2.2px rgba(255,255,255,.01),inset 0 0 0 4.2px #111}
.cap.dk{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.22)}
.cap.dk::before{background:radial-gradient(circle,#fff 1.9px,transparent 2.2px) 0 0/6.2px 4px}
.cap.dk::after{border-color:#fff;box-shadow:inset 0 0 0 4.2px #fff}
.nav{position:absolute;left:0;right:0;top:44px;height:44px;display:flex;align-items:center;padding:0 16px;z-index:4}
.body{position:absolute;left:0;right:0;top:88px;bottom:83px;overflow:hidden}
.body.full{bottom:0}
.tab{position:absolute;left:0;right:0;bottom:0;height:83px;display:flex;padding:0 8px 34px;z-index:4}
.tab a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;min-height:49px}
.tab::after,.body.full::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;margin-left:-67px;background:currentColor;opacity:.85}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ms{font-family:var(--latin)}
</style>
</head>
