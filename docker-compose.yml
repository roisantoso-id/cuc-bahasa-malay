# JomBelajar:官网 + 背单词后台网页 + 小程序接口,部署在腾讯云新加坡轻量服务器
# 数据库用腾讯云 MySQL(内网,自带备份),连接串写在 .env 的 DATABASE_URL
#   第一次:cp .env.example .env,填好后 docker compose up -d --build
#   更新:bash deploy/deploy-compose.sh
services:
  # 反向代理 + 自动 HTTPS;官网和后台网页都是静态文件,直接由 caddy 托管
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    # 加固:只保留绑 80/443 端口的权限,根文件系统只读
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 里填 DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN:-www.bahasa.cn}
      APEX_DOMAIN: ${APEX_DOMAIN:-bahasa.cn}
    volumes:
      # 挂目录不挂单个文件:rsync 换掉文件后,单文件挂载还指着旧文件,reload 不生效
      - ./deploy:/etc/caddy:ro
      - ./admin/public:/srv/admin:ro
      - ./website:/srv/website:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  # 后端:小程序接口 /api/app/*、后台接口 /api/admin/*、老师照片 /uploads/*
  api:
    build: { context: ., dockerfile: admin/Dockerfile }
    restart: unless-stopped
    # 加固:不需要任何特权,根文件系统只读(只写 /data 这个卷)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 里填 DATABASE_URL=mysql://用户:密码@内网IP:3306/库名}
      APPID: ${APPID:-}
      APPSECRET: ${APPSECRET:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      AUDIO_BASE: ${AUDIO_BASE:?请在 .env 里填 AUDIO_BASE}
      # 后台 AI 生成发音（admin/tts.mjs）；不填只是这个功能不能用
      AZURE_TTS_KEY: ${AZURE_TTS_KEY:-}
      AZURE_TTS_REGION: ${AZURE_TTS_REGION:-eastus}
    volumes:
      - uploads:/data

volumes:
  uploads:
  caddy_data:
  caddy_config:
