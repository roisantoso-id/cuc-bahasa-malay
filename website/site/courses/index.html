<main class="wrap">
  <p class="crumb"><a href="/">首页</a> · 课程</p>
  <h1>课程安排</h1>
  <p class="a-lede">按起点分两条路线。每一课都有课文、生词、练习，学完的生词进入每日复习。</p>
  <!-- 级别和说明是初稿,待教授确认后改 -->

  <section class="sec" style="padding-top:16px" aria-labelledby="zeroH">
    <h2 id="zeroH" style="font-size:26px;margin-bottom:16px">零基础路线</h2>
    <div class="rows">
      <a class="row" href="/#open"><span class="r-name">入门</span><span class="r-desc">字母、发音和拼读<small>学会看到单词就能读出来</small></span><span class="r-go" aria-hidden="true">→</span></a>
      <a class="row" href="/#open"><span class="r-name">基础</span><span class="r-desc">日常会话<small>打招呼、数字、时间、问路、购物、点餐</small></span><span class="r-go" aria-hidden="true">→</span></a>
      <a class="row" href="/#open"><span class="r-name">进阶</span><span class="r-desc">语法和阅读<small>常用词缀、句型，读短文</small></span><span class="r-go" aria-hidden="true">→</span></a>
    </div>
  </section>

  <section class="sec" style="padding-top:0" aria-labelledby="herH">
    <h2 id="herH" style="font-size:26px;margin-bottom:16px">有基础路线</h2>
    <div class="rows">
      <a class="row" href="/#open"><span class="r-name">书面语</span><span class="r-desc">口语和正式马来语的区别<small>常见口语说法对应的标准写法</small></span><span class="r-go" aria-hidden="true">→</span></a>
      <a class="row" href="/#open"><span class="r-name">语法</span><span class="r-desc">词缀和句子结构<small>me-、ber-、di-、-kan、-i 等怎么用</small></span><span class="r-go" aria-hidden="true">→</span></a>
      <a class="row" href="/#open"><span class="r-name">阅读写作</span><span class="r-desc">读文章、写短文<small>新闻、通知、书信</small></span><span class="r-go" aria-hidden="true">→</span></a>
    </div>
  </section>

  <div class="ctas"><a class="btn btn-main" href="/#open">打开小程序开始学</a></div>
