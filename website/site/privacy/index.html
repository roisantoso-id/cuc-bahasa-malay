  <h1>隐私政策</h1>
  <p class="muted">更新于 <time datetime="{{SITE_UPDATED}}">{{SITE_UPDATED}}</time></p>

  <h2>本网站</h2>
  <p>本网站只用来介绍课程，不需要登录，不收集你填写的个人信息，也不使用广告追踪。</p>

  <h2>小程序</h2>
  <p>小程序的个人信息处理规则以小程序内的《隐私保护指引》为准。简要说明：</p>
  <ul>
    <li>微信登录：用来识别你的账号、保存学习记录，不获取你的手机号。</li>
    <li>学习记录：学了哪些课、练习成绩、单词复习情况，只用于给你安排学习。</li>
    <li>录音（如使用跟读功能）：只在你主动录音时使用麦克风。</li>
  </ul>

  <h2>联系我们</h2>
  <p>对隐私有疑问，可以在小程序「我的」里反馈<!--IF_SITE_EMAIL-->，或写信到 <a href="mailto:{{SITE_EMAIL}}">{{SITE_EMAIL}}</a><!--/IF_SITE_EMAIL-->。</p>
